# ============================================================
# VSR 视频硬字幕/水印移除引擎 manifest（v0.1）
# ------------------------------------------------------------
# v0.1 设计（VSR_VIDEO_SUBTITLE_REMOVER_INTEGRATION_ANALYSIS.md §4）：
#   - paradigm: integrated（完全自定义模式，继承 CustomEngine）
#   - 模型布局：video/vsr/（4 算法子目录 + V5/ch_det OCR 目录）
#   - 能力：video-editing（视频硬字幕/水印移除，保留原音频）
#   - variant = inpaint 算法（4 个）：
#       * VSR/STTN-AUTO   ：智能擦除（默认，无需 OCR 检测，直接按选区生成 mask）
#       * VSR/STTN-DET    ：检测式擦除（需 OCR 定位字幕）
#       * VSR/LAMA        ：图像级 inpainting（需 OCR）
#       * VSR/PROPAINTER  ：视频级 inpainting（需 OCR，720p 需 ~25G 显存）
#   - OCR 检测模型（PP-OCRv5 server/mobile）作为共享组件：
#       * exclusive_group vsr-ocr：server/mobile 至少下载一个即可
#       * role: main（缺失时整组阻断启动，提示用户至少下载一个 OCR）
#
# 互斥组设计（v0.4.x 平台语义："每组至少下载一个即可启动"）：
#   - vsr-inpaint：4 个算法权重互斥组（下载任意一个算法即可启动引擎，
#     多算法可同时下载，运行时按 variant 加载）
#   - vsr-ocr    ：OCR server/mobile 互斥组（至少一个，STTN-DET/LAMA/
#     PROPAINTER 需要检测能力）
#
# ⚠️ STTN 权重格式说明（v0.1 关键决策）：
#   Dev-Jahn/sttn-auto|sttn-det 仓库提供的是 safetensors 格式（无官方
#   infer_model.pth / sttn.pth 直链），本地落地为 model.safetensors，
#   STTN 加载器（sttn_auto_inpaint.py / sttn_det_inpaint.py）需兼容
#   safetensors 读取（torch.load 失败时回退 safetensors.torch.load_file，
#   提取 netG 状态字典）。见 T3.2 代码适配。
#
# ⚠️ LAMA 权重来源说明：
#   上游 VSR 需要 TorchScript 版 big-lama.pt（torch.jit.load 加载），
#   绝大多数 HF 仓库提供的是 PyTorch checkpoint（不兼容）。
#   采用 Sanster 官方 GitHub Release 的 TorchScript 文件（205.7MB，实测可下）。
#
# 字段规范详见 PR/development-guide.md §30 manifest.yaml v0.2 规范
# 校验逻辑见 core/src/core/manifest_schema.py
# ============================================================

# ===== v0.1 必需字段 =====
engine_id: video_subtitle_remover_d1e2f3a4
engine_name: VSR-VideoSubtitleRemover
engine_version: 1.0.0
aireliable_compat: ">=0.0.16"
uv_env_name: video-vsr
export_mode: source

# ===== v0.1 可选字段 =====
description: "VSR 视频硬字幕/水印移除引擎（PaddleOCR PP-OCRv5 字幕检测 + 4 种 inpaint 算法：STTN-AUTO 智能擦除 / STTN-DET 检测擦除 / LAMA 图像修复 / ProPainter 视频修复，输出保留原音频）"

# ===== v0.2 新增字段 =====
# ⚠️ capabilities 不是 manifest 顶层字段（extra=forbid 会报错），
#    能力由引擎 /capabilities 端点声明（server.py 中实现 video-editing）
engine_uid: aireliable://aijiange/video/video_subtitle_remover_d1e2f3a4
paradigm: integrated
sdk_version: ">=0.3.0"

# 作者信息（v0.2.7：author 指创建引擎的作者）
author:
  name: AI剑歌

# 第三方开源引用（v0.2.7 新增）
third_party_references:
  - name: video-subtitle-remover
    author: YaoFANGUK
    github: https://github.com/YaoFANGUK/video-subtitle-remover
    license: Apache-2.0
    description: 引擎核心能力（字幕/水印检测 + 4 种 inpainting 算法）来自 video-subtitle-remover 项目 v1.4.0
  - name: PP-OCRv5
    author: PaddlePaddle
    github: https://github.com/PaddlePaddle/PaddleOCR
    license: Apache-2.0
    description: 字幕文本框检测（PP-OCRv5 server/mobile 检测模型）
  - name: STTN
    author: Dev-Jahn
    github: https://github.com/researchmm/STTN
    license: Apache-2.0
    description: 时空 transformer 视频修复（STTN-AUTO / STTN-DET 算法权重，safetensors 社区转换版）
  - name: Big-LAMA
    author: Sanster
    github: https://github.com/Sanster/models
    license: Apache-2.0
    description: LaMa 图像级 inpainting TorchScript 权重
  - name: ProPainter
    author: sczhou
    github: https://github.com/sczhou/ProPainter
    license: Apache-2.0
    description: 视频传播修复（ProPainter + RAFT 光流 + recurrent flow completion）

# 来源信息
source:
  type: github
  github_repo: YaoFANGUK/video-subtitle-remover
  branch: main

# 升级信息
upgrade:
  check_url: https://api.github.com/repos/AIJianGe/aireliable-engine-video-subtitle-remover/releases/latest
  auto_check: true

# 节点包依赖（integrated 范式不依赖节点包）
node_packages: []

# ============================================================
# v0.2.5+ 引擎环境配置（env_config 块）
# 供 EngineEnvManager 读取以决定是否检测 torch、默认 CUDA 版本等。
#
# VSR 基于 torch（STTN/LAMA/ProPainter）+ PaddlePaddle（OCR 检测）：
#   - paddlepaddle-gpu==3.0.0（cu126 index）+ paddleocr==3.4.0
#   - torch 2.7.0（cu126，与 paddle 3.0.0 保持 CUDA 版本一致，避免同环境冲突）
#   - python 3.10/3.11（envs/video-vsr pyproject.toml 限定 >=3.10,<3.12，
#     uv 实际解析到 3.11；paddlepaddle-gpu 3.0.0 在 3.12 上依赖解析无解）
# ============================================================
env_config:
  requires_torch: true
  torch_version_constraint: '>=2.0.0'
  default_cuda_version: cu126
  supported_cuda_versions:
    - cu118
    - cu121
    - cu124
    - cu126
  requires_python: '>=3.10,<3.12'
  notes: 'VSR 视频字幕移除引擎：PyTorch（STTN/LAMA/ProPainter 推理）+ PaddlePaddle 3.0.0 / PaddleOCR 3.4.0（PP-OCRv5 字幕检测）。paddle 与 torch 的 CUDA 版本必须一致（推荐 cu126），否则同环境共存会冲突。'
  # v0.2.12+ 引擎推荐版本组合（T2.3 校验通过后回填实际版本）
  recommended_versions:
    torch: '2.7.0'
    torchvision: '0.22.0'
    reason: 'VSR 引擎环境（envs/video-vsr）推荐组合：torch 2.7.0 + paddlepaddle-gpu 3.0.0 均使用 cu126 源，CUDA 版本一致性保证同环境共存；paddleocr 3.4.0 提供 PP-OCRv5 字幕检测（schema 仅校验 torch/torchvision，paddle 版本见 notes）'

# ============================================================
# v0.2.1 新增：models 块（模型分类规范化）
# 详见 PR/architecture.md §16.4 manifest.models 块
# ============================================================
models:
  # ===== 模型目录布局 =====
  model_layout:
    base: video/vsr/

  # ===== 默认 variant（STTN-AUTO 智能擦除，VSR 默认算法）=====
  default_variant: VSR/STTN-AUTO

  # ===== 模型变体列表（4 个，按 inpaint 算法划分）=====
  # v0.3.6+ variant.name 必须为 author/model 格式（命名空间规范）
  # 注意：name 必须与引擎 model_scanner.py 的 _KNOWN_VARIANTS 完全一致
  #（variant 扫描匹配契约）
  variants:
    # ----- 1. STTN-AUTO（智能擦除，默认，无需 OCR） -----
    - name: VSR/STTN-AUTO
      alias: STTN-AUTO
      base_model: STTN
      precision: fp32
      loader: sttn
      vram_required: 4GB                # 640x120 输入窗口，显存占用小
      path: video/vsr/sttn-auto
      model_file_ids:
        - vsr-sttn-auto
      uv_env: envs/video-vsr

    # ----- 2. STTN-DET（检测式擦除，需 OCR） -----
    - name: VSR/STTN-DET
      alias: STTN-DET
      base_model: STTN
      precision: fp32
      loader: sttn
      vram_required: 4GB
      path: video/vsr/sttn-det
      model_file_ids:
        - vsr-sttn-det
        - vsr-ocr-server                  # OCR 检测（server/mobile 二选一，exclusive_group vsr-ocr）
        - vsr-ocr-mobile
      uv_env: envs/video-vsr

    # ----- 3. LAMA（图像级 inpainting，需 OCR） -----
    - name: VSR/LAMA
      alias: LAMA
      base_model: LAMA
      precision: fp32
      loader: lama
      vram_required: 2GB
      path: video/vsr/big-lama
      model_file_ids:
        - vsr-lama
        - vsr-ocr-server
        - vsr-ocr-mobile
      uv_env: envs/video-vsr

    # ----- 4. PROPAINTER（视频级 inpainting，需 OCR） -----
    - name: VSR/PROPAINTER
      alias: PROPAINTER
      base_model: ProPainter
      precision: fp32
      loader: propainter
      vram_required: 25GB               # 720p 需 ~25G 显存（分析 §5）
      path: video/vsr/propainter
      model_file_ids:
        - vsr-propainter
        - vsr-ocr-server
        - vsr-ocr-mobile
      uv_env: envs/video-vsr

  # ===== 模型文件清单（6 块：OCR server/mobile 共享 + 4 算法权重）=====
  # key_files 按 HuggingFace API 真实文件列表核对填写（2026-09-12，hf-mirror API）
  #
  # 总下载量估算：
  #   OCR（二选一）server 88MB 或 mobile 4.7MB + 算法（至少一个）
  #   STTN-AUTO 66MB / STTN-DET 66MB / LAMA 206MB / ProPainter 320MB
  model_files:
    # ============================================================
    # 1. OCR 检测模型 - PP-OCRv5 server（精准，marker 整仓）
    # ============================================================
    - id: vsr-ocr-server
      role: main                        # 与 mobile 同组互斥（vsr-ocr 组至少下载一个即可启动）
      filename: inference.yml            # 标志文件（PaddleX 模型配置，也在 key_files 中）
      target_dir: video/vsr/V5/ch_det
      format: marker
      # v0.4.x exclusive_group：与 mobile 互斥（二选一即可，下载对话框"至少选一个"）
      exclusive_group: vsr-ocr
      required_for: [VSR/STTN-DET, VSR/LAMA, VSR/PROPAINTER]  # 需要检测能力的 variant
      source:
        type: huggingface
        repo_id: PaddlePaddle/PP-OCRv5_server_det
        filename: inference.yml
        # 仓库根 URL（无 /resolve/main/ 子路径）→ subdir_prefix 为空，
        # key_files 本地路径 = 远端仓库相对路径
        url: https://huggingface.co/PaddlePaddle/PP-OCRv5_server_det
        mirror_url: https://hf-mirror.com/PaddlePaddle/PP-OCRv5_server_det
      # key_files 按仓库真实文件列表核对（2026-09-12，hf-mirror API）：
      #   PaddleX TextDetection(model_name=..., model_dir=...) 本地目录加载
      #   需要 inference.yml（模型配置）+ inference.pdiparams（权重）+ inference.json；
      #   config.json 为仓库自带 HF 配置（一并下载，防 PaddleX 探测缺失）。
      #   ⚠️ 该仓库无 inference.pdmodel（PaddleX 3.0 支持 json+pdiparams 加载，已确认）
      key_files:
        - inference.yml
        - inference.json
        - inference.pdiparams
        - config.json
      description: "PP-OCRv5 server 字幕检测模型（~88MB，精准模式，STTN-DET/LAMA/PROPAINTER 用；PaddleX 本地目录加载，无需 pdmodel）"

    # ============================================================
    # 2. OCR 检测模型 - PP-OCRv5 mobile（快速，marker 整仓）
    # ============================================================
    - id: vsr-ocr-mobile
      role: main
      filename: inference.yml
      target_dir: video/vsr/V5/ch_det_fast
      format: marker
      exclusive_group: vsr-ocr           # 与 server 互斥（二选一）
      required_for: [VSR/STTN-DET, VSR/LAMA, VSR/PROPAINTER]
      source:
        type: huggingface
        repo_id: PaddlePaddle/PP-OCRv5_mobile_det
        filename: inference.yml
        url: https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_det
        mirror_url: https://hf-mirror.com/PaddlePaddle/PP-OCRv5_mobile_det
      key_files:
        - inference.yml
        - inference.json
        - inference.pdiparams
        - config.json
      description: "PP-OCRv5 mobile 字幕检测模型（~4.7MB，快速模式，STTN-DET/LAMA/PROPAINTER 用；PaddleX 本地目录加载，无需 pdmodel）"

    # ============================================================
    # 3. STTN-AUTO 权重（智能擦除，safetensors 社区转换版）
    # ============================================================
    - id: vsr-sttn-auto
      role: main
      filename: model.safetensors        # 本地落地名（与 sttn_auto_inpaint.py 加载器兼容）
      target_dir: video/vsr/sttn-auto
      format: safetensors
      size_bytes: 66237084               # 66MB（hf-mirror API 核对，F32 16.5M 参数）
      required_for: [VSR/STTN-AUTO]
      # v0.4.x exclusive_group：与其余 3 算法互斥（至少下载一个算法即可启动引擎）
      exclusive_group: vsr-inpaint
      source:
        type: huggingface
        repo_id: Dev-Jahn/sttn-auto
        filename: model.safetensors
        url: https://huggingface.co/Dev-Jahn/sttn-auto/resolve/main/model.safetensors
        mirror_url: https://hf-mirror.com/Dev-Jahn/sttn-auto/resolve/main/model.safetensors
      description: "STTN-AUTO 智能擦除权重（66MB，safetensors 格式；加载器自动提取 netG 状态字典，无需 OCR 检测，按选区直接生成 mask）"

    # ============================================================
    # 4. STTN-DET 权重（检测式擦除，safetensors 社区转换版）
    # ============================================================
    - id: vsr-sttn-det
      role: main
      filename: model.safetensors
      target_dir: video/vsr/sttn-det
      format: safetensors
      size_bytes: 66237076               # 66MB（hf-mirror API 核对，F32 16.5M 参数）
      required_for: [VSR/STTN-DET]
      exclusive_group: vsr-inpaint
      source:
        type: huggingface
        repo_id: Dev-Jahn/sttn-det
        filename: model.safetensors
        url: https://huggingface.co/Dev-Jahn/sttn-det/resolve/main/model.safetensors
        mirror_url: https://hf-mirror.com/Dev-Jahn/sttn-det/resolve/main/model.safetensors
      description: "STTN-DET 检测式擦除权重（66MB，safetensors 格式；加载器自动提取 netG 状态字典，配合 OCR 检测定位字幕）"

    # ============================================================
    # 5. LAMA 权重（图像级 inpainting，TorchScript）
    # ============================================================
    - id: vsr-lama
      role: main
      filename: big-lama.pt              # TorchScript 版（torch.jit.load 加载）
      target_dir: video/vsr/big-lama
      format: pt
      size_bytes: 205669692              # 205.7MB（GitHub Release HEAD 实测 Content-Length）
      required_for: [VSR/LAMA]
      exclusive_group: vsr-inpaint
      source:
        # Sanster 官方 Release（TorchScript 格式，与 torch.jit.load 兼容；
        # HF 上多为 PyTorch checkpoint 不兼容，故直接走 GitHub Release 直链）
        type: url
        url: https://github.com/Sanster/models/releases/download/add_big_lama/big-lama.pt
      description: "Big-LAMA 图像级 inpainting TorchScript 权重（205.7MB，torch.jit.load 加载；GitHub Release 直链，实测 302 → Azure Blob 200 可下）"

    # ============================================================
    # 6. ProPainter 权重（视频级 inpainting，marker 整仓）
    # ============================================================
    - id: vsr-propainter
      role: main
      filename: ProPainter.pth           # 标志文件（在 key_files 中一并下载）
      target_dir: video/vsr/propainter
      format: marker
      required_for: [VSR/PROPAINTER]
      exclusive_group: vsr-inpaint
      source:
        type: huggingface
        repo_id: camenduru/ProPainter
        filename: ProPainter.pth
        # 仓库根 URL（无 /resolve/main/ 子路径）→ subdir_prefix 为空
        url: https://huggingface.co/camenduru/ProPainter
        mirror_url: https://hf-mirror.com/camenduru/ProPainter
      # key_files 按仓库真实文件列表核对（2026-09-12，hf-mirror API）：
      #   propainter_inpaint.py 需要：ProPainter.pth（主模型）+
      #   raft-things.pth（RAFT 光流）+ recurrent_flow_completion.pth（光流补全）
      #   未声明（propainter_inpaint.py 不使用的仓库内容）：
      #     - i3d_rgb_imagenet.pt（I3D 特征提取，训练用）
      #     - dataset_masks.zip（训练数据集）
      key_files:
        - ProPainter.pth
        - raft-things.pth
        - recurrent_flow_completion.pth
      description: "ProPainter 视频级 inpainting 权重（主模型 + RAFT 光流 + recurrent flow completion，共 ~320MB；720p 需 ~25G 显存）"
